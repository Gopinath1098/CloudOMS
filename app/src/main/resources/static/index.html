<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Cloud OMS App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .logo {
            width: 100%;
            max-width: 700px;
            height: auto;
            margin-bottom: 30px;
        }

        h1 {
            color: #0078D7;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #333;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #0078D7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }

        .button:hover {
            background: #005a9e;
        }

        @media (max-width: 768px) {
            .logo {
                max-width: 95%;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .button {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Cloud OMS Logo" class="logo">

    <h1>Welcome to Cloud OMS App</h1>

    <p>
        This project uses <strong>Spring Boot</strong> as the backend,
        <strong>Azure SQL Database</strong> for persistence,
        <strong>Azure Key Vault</strong> for secure secrets management,
        <strong>GitHub Actions</strong> for CI/CD automation, and is hosted on
        <strong>Azure Web Apps</strong>.
    </p>

    <a class="button"
       href="https://cloud-oms-dev-atgdcmhghwhsfmgp.centralindia-01.azurewebsites.net/swagger-ui/index.html"
       target="_blank">
        Open Swagger API Documentation
    </a>

</div>

</body>
</html>
