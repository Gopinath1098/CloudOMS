spring:
  datasource:
    url: ${cloud-oms-db-url}
    username: ${cloud-oms-db-username}
    password: ${cloud-oms-db-password}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: https://cloud-oms-dev.vault.azure.net/
