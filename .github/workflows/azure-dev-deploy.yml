name: Build and Deploy Spring Boot App to Azure WebApp

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -f app/pom.xml clean package -DskipTests

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE-CLIENT-ID }}
          tenant-id: ${{ secrets.AZURE-TENANT-ID }}
          subscription-id: ${{ secrets.AZURE-SUBSCRIPTION-ID }}
          client-secret: ${{ secrets.AZURE-CLIENT-SECRET }}

      - name: Get secrets from Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: cloud-oms-dev
          secrets: |
            AZURE-CLIENT-ID
            AZURE-TENANT-ID
            AZURE-SUBSCRIPTION-ID
            AZURE-CLIENT-SECRET

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: cloud-oms-dev
          package: target/*.jar
